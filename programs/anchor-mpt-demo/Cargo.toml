[package]
name = "anchor-mpt-demo"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anchor_mpt_demo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
eth_trie_solana = { git = "https://github.com/zhchiEarth/eth-trie-solana" }
anchor-lang = "0.30.1"
primitive-types-solana = "0.1.0"
alloy-rlp = { version = "0.3.8", features = ["derive"] }
alloy-rlp-derive = "^0.3.8"
bytes = "1.7.2"
